<!DOCTYPE html> <!-- Declara que el documento utiliza el estándar HTML5 -->
<html lang="en"> <!-- Elemento raíz del documento, configurado en idioma inglés -->
<head> <!-- Inicio de la sección de metadatos e información no visible en pantalla -->
  <meta charset="UTF-8"> <!-- Define la codificación de caracteres UTF-8 para admitir acentos y símbolos -->
  <meta name="viewport" content="width=device.width, initiañ-scale=1.0"> <!-- Ajusta la vista para pantallas de dispositivos móviles (contiene pequeñas erratas en content) -->
  <title>Imagenes en HTML</title> <!-- Título de la página que aparece en la pestaña del navegador -->
</head> <!-- Cierre del encabezado del documento -->

<body> <!-- Inicio del cuerpo del documento donde se ubica el contenido visible -->
  <h2>Imagenes en HTML</h2> <!-- Subtítulo de nivel 2 para la sección principal -->
    <h3>Locales</h3> <!-- Subtítulo de nivel 3 para la subsección de imágenes locales -->
    <img src="caritas.png" alt="Imagen de carita feliz"> <!-- Muestra una imagen almacenada localmente con su texto alternativo descriptivo -->
    <h3>Locales redismensionado</h3> <!-- Subtítulo de nivel 3 para imágenes locales con dimensiones ajustadas -->
    <img src="imagenes/carita.png" alt="" width="200" height="100"> <!-- Muestra una imagen desde una subcarpeta con ancho de 200px y alto de 100px -->
    <h3>Desde internet</h3> <!-- Subtítulo de nivel 3 para la subsección de imágenes alojadas en la web -->
    <img src="https://st2.depositphotos.com/2172759/11751/v/950/depositphotos_117511772-stock-illustration-happy-face-isolated-on-white.jpg" <!-- Carga una imagen estática mediante su enlace URL de internet --> 
    width="200" height="200" <!-- Define el tamaño de la imagen en 200px de ancho por 200px de alto -->
    alt=""> <!-- Atributo de texto alternativo vacío para la imagen externa -->
    <h3>Animaciones</h3> <!-- Subtítulo de nivel 3 para la sección de imágenes animadas (GIFs) -->
    <img src="https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExejMydmVybzBiY3lkdWd1Nnp1MzJiMXA3Ymt3czE3NGp1NDZuZDg5YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/tXL4FHPSnVJ0A/giphy.gif" <!-- Carga una imagen animada (GIF) desde un servidor en línea --> 
    width="200" height="200" <!-- Define las dimensiones del GIF animado en 200x200 píxeles -->
    alt=""> <!-- Atributo de texto alternativo vacío para la animación -->
</body> <!-- Cierre del cuerpo del documento -->
</html> <!-- Cierre del documento HTML -->
