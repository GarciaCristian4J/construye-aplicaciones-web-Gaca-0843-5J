<!DOCTYPE html> <!-- Declara que el documento utiliza el estándar HTML5 -->
<html lang="en"> <!-- Elemento raíz de la página, configurado en idioma inglés -->

  <head> <!-- Inicio de la sección con metadatos e información que no se ve en la pantalla -->
    <meta charset="UTF-8"> <!-- Define la codificación de caracteres a UTF-8 para admitir acentos y símbolos -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ajusta el tamaño de la página a la pantalla del dispositivo (diseño responsivo) -->
    <title>Encabezado HTML</title> <!-- Título del documento que aparece en la pestaña del navegador -->
  </head> <!-- Cierre del encabezado de la página -->

  <body> <!-- Inicio del cuerpo del documento donde va todo el contenido visible -->
    <h1>Titulo 1</h1> <!-- Encabezado de nivel 1 (el título principal y de mayor jerarquía) -->
    <h2>Titulo 2</h2> <!-- Encabezado de nivel 2 (subtítulo de segundo rango) -->
    <h3>Titulo 3</h3> <!-- Encabezado de nivel 3 (subtítulo de tercer rango) -->
    <h4>Titulo 4</h4> <!-- Encabezado de nivel 4 (subtítulo de cuarto rango) -->
    <h5>Titulo 5</h5> <!-- Encabezado de nivel 5 (subtítulo de quinto rango) -->
    <h6>Titulo 6</h6> <!-- Encabezado de nivel 6 (el título de menor jerarquía y tamaño más pequeño) -->
  </body> <!-- Cierre del cuerpo del documento -->

</html> <!-- Cierre del documento HTML -->
